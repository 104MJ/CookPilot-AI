{% extends "base.html" %}
{% load static %}
{% block title %}Historique — CookPilot{% endblock %}

{% block content %}
<h1 class="page-heading">
  <img src="https://unpkg.com/lucide-static@latest/icons/history.svg" alt="">
  Historique
</h1>
<p style="color: var(--color-text-muted)">Vos analyses et recettes précédentes.</p>

<div id="history-error-slot"></div>
<div id="history-skeleton">
  <div class="card skeleton skeleton-block" style="margin-bottom: var(--space-3)"></div>
  <div class="card skeleton skeleton-block"></div>
</div>
<div class="session-list" id="session-list" style="display:none"></div>

<div class="history-pagination" id="history-pagination" style="display:none">
  <button type="button" class="btn btn-secondary" id="history-prev">Précédent</button>
  <span class="hint" id="history-page-label"></span>
  <button type="button" class="btn btn-secondary" id="history-next">Suivant</button>
</div>
{% endblock %}

{% block extra_js %}
<script src="{% static 'js/api.js' %}"></script>
<script src="{% static 'js/alerts.js' %}"></script>
<script src="{% static 'js/history.js' %}"></script>
{% endblock %}
