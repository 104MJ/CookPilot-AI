services:
  # 1. Web Service (Django REST API + Frontend)
  - type: web
    name: cookpilot-web
    env: python
    plan: free
    region: frankfurt
    buildCommand: |
      apt-get update && apt-get install -y libgl1 libglib2.0-0 libsm6 libxext6 libxrender1 libxcb1 ffmpeg
      pip install -r backend/requirements.txt
      python backend/manage.py collectstatic --noinput
      python backend/manage.py migrate --noinput
    startCommand: gunicorn --chdir backend config.wsgi:application --bind 0.0.0.0:$PORT --workers 3
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://cookpilot-ai.onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: cookpilot-db
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: cookpilot-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: cookpilot-redis
          property: connectionString
      - key: MISTRAL_API_KEY
        sync: false
      - key: SPOONACULAR_API_KEY
        sync: false

  # 2. Celery Worker (Async AI & Background Tasks)
  # DESACTIVE pour le deploiement gratuit : Render facture les Background
  # Workers a partir de 7$/mois (pas de tier gratuit), et aucune tache Celery
  # reelle n'est encore branchee cote code (generate_recipe/detect_ingredients
  # tournent en synchrone). A reactiver si le traitement async est implemente
  # et qu'un budget est disponible.
  # - type: worker
  #   name: cookpilot-worker
