  #   region: frankfurt
  #   buildCommand: |
  #     apt-get update && apt-get install -y libgl1 libglib2.0-0 libsm6 libxext6 libxrender1 libxcb1 ffmpeg
  #     pip install -r backend/requirements.txt
  #   startCommand: celery -A config worker --chdir backend --loglevel=info
  #   envVars:
  #     - key: DJANGO_SECRET_KEY
  #       fromService:
  #         type: web
  #         name: cookpilot-web
  #         envVarKey: DJANGO_SECRET_KEY
  #     - key: DATABASE_URL
  #       fromDatabase:
  #         name: cookpilot-db
  #         property: connectionString
  #     - key: CELERY_BROKER_URL
  #       fromService:
  #         type: redis
  #         name: cookpilot-redis
  #         property: connectionString
  #     - key: MISTRAL_API_KEY
  #       sync: false
  #     - key: SPOONACULAR_API_KEY
  #       sync: false

  # 3. Redis Instance
  - type: redis
    name: cookpilot-redis
    plan: free
    region: frankfurt
    ipAllowList: []

databases:
  # 4. Managed PostgreSQL Database
  - name: cookpilot-db
    databaseName: cookpilot
    user: cookpilot
    region: frankfurt
    plan: free
